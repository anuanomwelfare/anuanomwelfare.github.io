name: One-Time Homecoming Field Cleanup

"on":
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to confirm — this permanently removes homecoming data from all members'
        required: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Remove homecoming field from all members
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          CONFIRM_INPUT: ${{ github.event.inputs.confirm }}
        run: node remove-homecoming-field.js
